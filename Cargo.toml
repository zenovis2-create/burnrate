[package]
name = "burnrate"
version = "0.2.0"
edition = "2021"
description = "htop for coding-agent spend: see what Claude Code and Codex actually cost you."
license = "MIT"
repository = "https://github.com/zenovis2-create/burnrate"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
